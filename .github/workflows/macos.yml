name: Build and verify macOS packages
on:
  workflow_dispatch:
    inputs:
      version:
        description: Published Windows payload version
        required: true
        type: string
      windows_sha256:
        description: Verified Windows ZIP SHA256
        required: true
        type: string
permissions:
  contents: write
jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate explicit inputs
        env:
          VERSION: ${{ inputs.version }}
          SHA256: ${{ inputs.windows_sha256 }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$SHA256" =~ ^[a-f0-9]{64}$ ]]
      - name: Assemble and test on real macOS
        env:
          APP_VERSION: ${{ inputs.version }}
          WINDOWS_SHA256: ${{ inputs.windows_sha256 }}
          APP_ARCH: ${{ matrix.arch }}
        run: python3 ci/build.py
      - name: Publish only verified macOS packages
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ inputs.version }}
          APP_ARCH: ${{ matrix.arch }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib,hashlib
          r=json.loads(pathlib.Path('out/macos-receipt.json').read_text())
          assert r['version']==os.environ['APP_VERSION'] and r['arch']==os.environ['APP_ARCH']
          assert r['ui']=='PASS' and r['recycleRestore']=='PASS'
          assert hashlib.sha256(pathlib.Path('out',r['name']).read_bytes()).hexdigest()==r['sha256']
          PY
          gh release upload "v$APP_VERSION" "out/LaoyuCleaner-macOS-$APP_ARCH.zip" "out/SHA256SUMS-macOS-$APP_ARCH.txt" --repo lyzbcy/laoyu-cleaner-downloads
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ matrix.arch }}-${{ inputs.version }}
          path: |
            out/*.json
            out/*.png
            out/*.log
            out/*.txt
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-${{ matrix.arch }}-${{ inputs.version }}
          path: out/
          retention-days: 30
